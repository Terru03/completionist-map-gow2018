name: Raven final authority CI

on:
  push:
    branches: [codex/all-ravens-release-candidate]
  workflow_dispatch:

jobs:
  raven-final-authority:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Lua 5.1 test runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check lupa

      - name: Python syntax and Raven Lua/model/template tests
        shell: pwsh
        run: |
          python -m py_compile .\tools\v0.10.5\raven_runtime_model.py
          python -m py_compile .\tools\v0.10.5\test_all_ravens_lua.py
          python -m py_compile .\tools\v0.10.5\test_raven_runtime_model.py
          python -m py_compile .\tools\v0.10.5\test_all_ravens_build.py
          python .\tools\v0.10.5\test_all_ravens_lua.py
          if ($LASTEXITCODE -ne 0) { throw 'Lua tests failed.' }
          python .\tools\v0.10.5\test_raven_runtime_model.py
          if ($LASTEXITCODE -ne 0) { throw 'Model tests failed.' }
          python .\tools\v0.10.5\test_all_ravens_build.py
          if ($LASTEXITCODE -ne 0) { throw 'Template/build tests failed.' }

      - name: Runner proof parser tests
        shell: pwsh
        run: |
          .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runner tests failed.' }

      - name: Native Raven bridge build and CTest
        shell: pwsh
        run: |
          cmake -S .\native\raven-authority-bridge -B .\build\raven-final-ci -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build .\build\raven-final-ci --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed.' }
          ctest --test-dir .\build\raven-final-ci -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native CTest failed.' }

      - name: Safety and authority contract scan
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            '.\tools\v0.10.5\all-ravens-map-runtime.lua',
            '.\tools\v0.10.5\all-ravens-gameplay-events.lua',
            '.\native\raven-authority-bridge\src\authority_runtime.cpp'
          )
          $forbidden=@(
            'WriteProcessMemory','NtWriteVirtualMemory','VirtualAllocEx','VirtualProtectEx',
            'CreateRemoteThread','QueueUserAPC','SetThreadContext','DebugActiveProcess',
            'SetMarkerState','SetToken','SetProgress','IncrementQuestProgress','StartQuest'
          )
          $findings=@()
          foreach($path in $paths){
            $text=Get-Content -LiteralPath $path -Raw
            foreach($token in $forbidden){
              if($text -match [regex]::Escape($token)){ $findings += "${path}:${token}" }
            }
          }
          if($findings.Count -gt 0){ throw "Prohibited tokens: $($findings -join ', ')" }
          $map=Get-Content -LiteralPath '.\tools\v0.10.5\all-ravens-map-runtime.lua' -Raw
          $events=Get-Content -LiteralPath '.\tools\v0.10.5\all-ravens-gameplay-events.lua' -Raw
          $native=Get-Content -LiteralPath '.\native\raven-authority-bridge\src\authority_runtime.cpp' -Raw
          foreach($required in @(
            'positiveEventEvidenceOnly=true',
            'atomicAuthorityClearsState=true',
            'AUTHORITY_BOUNDARY',
            'alive_requires_atomic_authority'
          )) {
            if($map -notmatch [regex]::Escape($required) -and $events -notmatch [regex]::Escape($required)) {
              throw "Missing final authority contract: $required"
            }
          }
          if($native -notmatch 'Publish every accepted capture') {
            throw 'Native freshness publication contract missing.'
          }
          Write-Host 'RAVEN_FINAL_AUTHORITY_SECURITY_PASSED findings=0'
