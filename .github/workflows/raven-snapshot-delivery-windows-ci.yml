name: Raven snapshot delivery Windows CI

on:
  push:
    branches:
      - codex/all-ravens-release-candidate
  workflow_dispatch:

jobs:
  snapshot-delivery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Lua 5.1 test runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check lupa

      - name: Parse PowerShell delivery tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tools/v0.10.5/raven-native-bridge-runner-support.ps1',
            'tools/v0.10.5/test-raven-authority-bridge-runner.ps1',
            'tools/v0.10.5/test-all-ravens-transaction.ps1',
            'tools/v0.10.5/test-raven-native-snapshot-delivery-offline-gates.ps1',
            'tools/v0.10.5/run-raven-native-snapshot-delivery-live-proof-and-push.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) { throw "PowerShell parse failed: $file :: $($errors[0].Message)" }
          }
          Write-Host "RAVEN_SNAPSHOT_DELIVERY_POWERSHELL_PARSE_PASSED files=$($files.Count)"

      - name: Native MSVC build and CTest
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\build-raven-authority-bridge.ps1 -Clean

      - name: Runner parser tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1

      - name: Lua and model tests
        shell: pwsh
        run: |
          python .\tools\v0.10.5\test_all_ravens_lua.py
          if ($LASTEXITCODE -ne 0) { throw 'Lua tests failed.' }
          python .\tools\v0.10.5\test_raven_runtime_model.py
          if ($LASTEXITCODE -ne 0) { throw 'Model tests failed.' }
          python .\tools\v0.10.5\test_all_ravens_build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build/template tests failed.' }

      - name: Security diff scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '5d97b4f'
          $paths = @(
            'native/raven-authority-bridge/src',
            'tools/v0.10.5/all-ravens-map-runtime.lua',
            'tools/v0.10.5/all-ravens-gameplay-events.lua'
          )
          $diff = (& git diff $base -- @paths) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read security diff.' }
          $patterns = @(
            'WriteProcessMemory', 'NtWriteVirtualMemory', 'VirtualAllocEx',
            'VirtualProtectEx', 'CreateRemoteThread', 'QueueUserAPC',
            'SetThreadContext', 'DebugActiveProcess', 'PROCESS_VM_WRITE',
            'PROCESS_VM_OPERATION', 'GENERIC_WRITE', 'FILE_APPEND_DATA',
            'CREATE_ALWAYS', 'TRUNCATE_EXISTING', 'SetMarkerState',
            'SetToken', 'SetProgress', 'IncrementQuestProgress', 'StartQuest'
          )
          $findings = @($patterns | Where-Object { $diff -match [regex]::Escape($_) })
          if ($findings.Count -gt 0) { throw "Prohibited APIs: $($findings -join ', ')" }
          if ($diff -notmatch '127\.0\.0\.1' -or $diff -notmatch 'SO_EXCLUSIVEADDRUSE' -or
              $diff -notmatch 'static_descriptor_writes=false') {
            throw 'Delivery safety contract missing.'
          }
          Write-Host 'RAVEN_SNAPSHOT_DELIVERY_WINDOWS_SECURITY_PASSED findings=0 process_writes=false save_writes=false progression_writes=false static_descriptor_writes=false'
