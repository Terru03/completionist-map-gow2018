name: Raven DXGI offline CI

on:
  push:
    branches:
      - codex/all-ravens-release-candidate
  workflow_dispatch:

jobs:
  dxgi-offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'tools/v0.10.5/build-raven-authority-bridge.ps1',
            'tools/v0.10.5/install-raven-authority-bridge.ps1',
            'tools/v0.10.5/rollback-raven-authority-bridge.ps1',
            'tools/v0.10.5/recover-raven-authority-bridge-startup.ps1',
            'tools/v0.10.5/test-raven-authority-bridge-install.ps1',
            'tools/v0.10.5/raven-native-bridge-runner-support.ps1',
            'tools/v0.10.5/test-raven-authority-bridge-runner.ps1',
            'tools/v0.10.5/test-raven-authority-bridge-offline-gates.ps1',
            'tools/v0.10.5/run-raven-authority-bridge-load-proof-and-push.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed: $file"
            }
          }
          Write-Host "RAVEN_DXGI_POWERSHELL_PARSE_PASSED files=$($files.Count)"

      - name: Native build and CTest
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\build-raven-authority-bridge.ps1 -Clean

      - name: Runner regression tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1

      - name: Security diff scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '4525be71a2c70306d8f97d5d13085486ed984e59'
          $changed = @(
            git diff --name-only "$base...HEAD" -- native/raven-authority-bridge tools/v0.10.5 |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          )
          $patterns = @(
            'WriteProcessMemory',
            'NtWriteVirtualMemory',
            'VirtualAllocEx',
            'VirtualProtectEx',
            'CreateRemoteThread',
            'QueueUserAPC',
            'SetThreadContext',
            'DebugActiveProcess',
            'VFSSetFloat',
            'VFSSetInt'
          )
          $findings = @()
          foreach ($file in $changed) {
            $text = Get-Content -Raw -LiteralPath $file
            foreach ($pattern in $patterns) {
              if ($text -match [regex]::Escape($pattern)) {
                $findings += "$file :: $pattern"
              }
            }
          }
          if (@($findings).Count -gt 0) {
            $findings | ForEach-Object { Write-Host $_ }
            throw "Security diff scan found $(@($findings).Count) prohibited API references."
          }
          Write-Host "RAVEN_DXGI_SECURITY_DIFF_SCAN_PASSED files=$(@($changed).Count) findings=0"
