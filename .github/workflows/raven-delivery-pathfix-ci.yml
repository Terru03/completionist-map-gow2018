name: Raven delivery pathfix CI

on:
  push:
    branches:
      - codex/all-ravens-release-candidate
  workflow_dispatch:

jobs:
  pathfix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Parse modified PowerShell runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v0.10.5/run-raven-native-snapshot-delivery-live-proof-and-push.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'PowerShell parse failed.'
          }
          Write-Host 'RAVEN_DELIVERY_PATHFIX_POWERSHELL_PARSE_PASSED'

      - name: Compile modified Python preparer
        shell: pwsh
        run: |
          python -m py_compile .\tools\v0.10.5\prepare-all-ravens-delivery-candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Python preparer compile failed.' }
          Write-Host 'RAVEN_DELIVERY_PATHFIX_PYTHON_COMPILE_PASSED'

      - name: Runner regression tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1
