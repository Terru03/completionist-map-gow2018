name: Raven final live proof runner CI

on:
  push:
    branches: [codex/all-ravens-release-candidate]
  workflow_dispatch:

jobs:
  runner-proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse final live runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='.\tools\v0.10.5\run-raven-native-snapshot-delivery-live-proof-and-push.ps1'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if(@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Final Raven live runner PowerShell parse failed.'
          }
          Write-Host 'RAVEN_FINAL_LIVE_RUNNER_PARSE_PASSED'
      - name: Proof parser regression
        shell: pwsh
        run: |
          .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1
          if($LASTEXITCODE -ne 0) { throw 'Raven runner proof tests failed.' }
          Write-Host 'RAVEN_FINAL_CHECKPOINT_PROOF_PASSED'
