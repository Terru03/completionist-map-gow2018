name: Raven delivery assignment CI

on:
  push:
    branches:
      - codex/all-ravens-release-candidate
  workflow_dispatch:

jobs:
  assignment-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify runner assignment AST
        shell: pwsh
        run: |
          $path = Resolve-Path 'tools/v0.10.5/run-raven-native-snapshot-delivery-live-proof-and-push.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'PowerShell parse failed.'
          }

          $assignments = @(
            $ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst]
            }, $true)
          )

          $left = @($assignments | ForEach-Object { $_.Left.Extent.Text })
          if ($left -notcontains '$worktreeCandidateRoot') {
            throw 'Missing standalone worktreeCandidateRoot assignment.'
          }
          if ($left -notcontains '$candidateRoot') {
            throw 'Missing standalone candidateRoot assignment.'
          }

          Write-Host 'RAVEN_DELIVERY_ASSIGNMENT_AST_PASSED'

      - name: Compile candidate preparer
        shell: pwsh
        run: |
          python -m py_compile .\tools\v0.10.5\prepare-all-ravens-delivery-candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Python preparer compile failed.' }
          Write-Host 'RAVEN_DELIVERY_PREPARER_COMPILE_PASSED'

      - name: Runner regression tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\v0.10.5\test-raven-authority-bridge-runner.ps1
