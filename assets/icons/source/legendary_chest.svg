<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#E8E3D6" stroke="#252B2C" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round">
    <!-- Compact reinforced lid: deliberately narrower and taller than the Nornir chest. -->
    <path d="M19 16 H45 L50 23 L46 28 H18 L14 23 Z"/>
    <!-- Tall reinforced chest body. -->
    <path d="M18 28 H46 L44 52 L40 55 H24 L20 52 Z"/>
  </g>

  <!-- Heavy vertical reinforcement keeps the silhouette readable at 24 px. -->
  <path d="M22 29 L24 52" fill="none" stroke="#252B2C" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M42 29 L40 52" fill="none" stroke="#252B2C" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Sharp radiant central split, the Legendary Chest family cue. -->
  <path d="M32 29 L37 36 L34 40 L38 45 L32 52 L26 45 L30 40 L27 36 Z" fill="#252B2C"/>
  <path d="M32 33 V48 M29.5 39.5 L32 42 L34.5 39.5" fill="none" stroke="#E8E3D6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
